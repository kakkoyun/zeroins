apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-sink
  namespace: default
data:
  relay.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          exporters: [debug]
        profiles:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-sink
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-sink
  template:
    metadata:
      labels:
        app: telemetry-sink
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args:
            - --feature-gates=+service.profilesSupport
            - --config=/conf/relay.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: telemetry-sink
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-sink
  namespace: default
spec:
  selector:
    app: telemetry-sink
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
